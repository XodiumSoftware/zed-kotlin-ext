id = "kotlin-dev"
name = "Kotlin DEV"
version = "0.4.2"
schema_version = 1
authors = ["evrsen", "cholwell", "illyrius666"]
description = "Kotlin language support."
repository = "https://github.com/XodiumSoftware/zed-kotlin-ext"

[language_servers.kotlin-dev-lsp]
name = "Kotlin LSP"
language = "Kotlin"

# Debug adapter backed by kotlin-lsp's embedded JetBrains debug server,
# started per session via the proxy sidecar (`start_debug_server`).
# The name MUST be "intellij_debugger": kotlin-lsp's DAP server rejects
# `initialize` requests whose adapterID isn't a registered server-side
# adapter id (XDebuggerDapServer.getAdapterById; the only id is
# "intellij_debugger" -> JvmDebuggerAdapter, verified on 263.4421.0).
# Zed forwards the scenario's adapter name as the DAP adapterID.
[debug_adapters.intellij_debugger]
schema_path = "debug_adapter_schemas/Kotlin.json"

[grammars.kotlin]
repository = "https://github.com/fwcd/tree-sitter-kotlin"
commit = "1852ea17b7f60fb3f9d84e0b1555d56b46b39fb1"
