name: Bug Report
description: File a bug report
type: "Bug"
assignees: [ "illyrius666" ]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to fill this out!
  - type: textarea
    attributes:
      label: Problem
      description: Please give a text description of how you reached the problem
      placeholder: |
        1. Install the extension...
        2. Do this...
        3. Do that...
        4. Observe the error...
    validations:
      required: true
  - type: textarea
    attributes:
      label: Solution (if any)
      description: Explain where you think the problem comes from (optional)
      placeholder: The proxy fails to rewrite archive URIs when...
    validations:
      required: false
  - type: input
    attributes:
      label: Version
      description: What extension version are you running?
      placeholder: DO NOT SAY "LATEST"
    validations:
      required: true
  - type: input
    attributes:
      label: Log
      description: "Paste the full language server log (`zed: open language server logs` > kotlin-dev-lsp). Always use [Pastebin](https://pastebin.com/). Must not be a screenshot of a log."
      placeholder: https://pastebin.com/...
    validations:
      required: true
  - type: markdown
    attributes:
      value: "Thank you for filling out the form! We will be with you soon. Please do not ask support to review your report."
